  <body>
    <noscript>
      <header>
        <h1>ReveriePaint · 安卓上的专业数字绘画工具</h1>
        <p>基于 Krita C++ 核心引擎与 Jetpack Compose 架构的 Android 原生开源数字绘画应用，具备 240+ 官方笔刷预设、稀疏瓦片无限图层、35 种实时滤镜与全流程事件流延时回放。</p>
      </header>
      <main>
        <section>
          <h2>设计理念</h2>
          <p>纯粹、专注、不妥协的创作体验。拒绝功能阉割，保留桌面级专业参数，完全开源无广告。</p>
        </section>
        <section>
          <h2>Krita 物理笔刷内核</h2>
          <p>集成 Krita 原生 C++ 图像处理内核，真实模拟物理笔触与颜料混合，笔刷工坊支持多维度自由微调。</p>
        </section>
        <section>
          <h2>硬件级压感手写笔适配</h2>
          <p>深度适配华为 M-Pencil、OPPO / 一加手写笔、三星 S Pen 与通用 Android 触控笔协议，支持自定义压力过渡曲线与触觉微震反馈。</p>
        </section>
        <section>
          <h2>多段折线选区与悬浮参考</h2>
          <p>支持逐点精确落位与单点独立撤销的折线套索；悬浮参考窗支持参考图与主画布实时镜像比对。</p>
        </section>
        <section>
          <h2>专业色彩工坊</h2>
          <p>PaintTool SAI 经典 V-HSV 色轮、色彩调和助手、3D 光影受光球与图片智能色卡提取。</p>
        </section>
        <section>
          <h2>全流程事件流延时回放</h2>
          <p>零性能额外损耗记录笔迹与图层演变全过程，随 .revp 独立工程文件完整归档，支持 0.5x–4x 倍速无缝拖动回放。</p>
        </section>
        <section>
          <h2>QQ群</h2>
          <p>代码完全开源，欢迎加入 QQ 交流群: 729283213。</p>
        </section>

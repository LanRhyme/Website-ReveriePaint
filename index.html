        <h1>ReveriePaint · 意境与算法的终极重构</h1>
        <p>基于 Krita C++ 核心引擎的 Android 原生数字绘画应用，专为平板与手写笔优化的专业创作工作流</p>
      </header>
      <main>
        <section>
          <h2>Krita 笔刷内核，真实颜料与物理混色</h2>
          <p>直接复用 Krita C++ 原生图像处理内核，模拟真实颜料混色与笔触纹理，内置 240+ 官方笔刷预设，支持在笔刷工坊中自由调整混色比、动态响应曲线与子帧平滑插值</p>
        </section>
        <section>
          <h2>稀疏瓦片架构，无限图层与分组</h2>
          <p>基于稀疏瓦片内存管理，在移动端大幅面创作中按需分配内存，支持无限图层创建、分组嵌套、剪贴蒙版与 25 种专业混合模式</p>
        </section>
        <section>
          <h2>莫兰迪配色体系，Material You 动态主题</h2>
          <p>采用沉静典雅的莫兰迪低饱和配色，原生支持 Material You 动态莫奈取色与工作区底色定制，让界面隐于创作背景，专注于画布光影</p>
        </section>
        <section>
          <h2>全流程事件录制，独立工程与延时回放</h2>
          <p>零性能开销记录笔迹、图层与参数演变全过程，录制数据随 .revp 独立工程文件归档，支持在画廊随时以 0.5x 至 4x 倍速无缝拖拽回放</p>
        </section>
